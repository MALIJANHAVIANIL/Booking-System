spring.application.name=resource-booking-system

# Database Configuration (Defaults to in-memory H2 if DB_URL is not set, or PostgreSQL when DB_URL environment variable is provided)
spring.datasource.url=${DB_URL:jdbc:h2:mem:booking_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Server Port
server.port=${PORT:8081}
